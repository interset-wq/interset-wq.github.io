  <script id="internote-search" src="https://interset-wq.github.io/plugins/search.js"
    data-index-url="https://interset-wq.github.io/search-index.json"
    data-placeholder="搜索"
    data-no-results="未找到结果"></script>
  <script>
    (function () {
      var pageTitle = "InterNote";
      var list = document.getElementById('post-list');
      var cloud = document.getElementById('tag-cloud');
      var emptyState = document.getElementById('empty-state');
      var heading = document.querySelector('.in-page-title');
      var knownLabels = [];

      function rows() {
        return list.querySelectorAll('.in-post-list-item-wrapper');
      }

      function badge(text, color) {
        var node = document.createElement('span');
        node.className = 'in-badge';
        node.style.backgroundColor = color;
        node.textContent = text;
        return node;
      }

      function postIcon() {
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'octicon');
        svg.setAttribute('width', '16');
        svg.setAttribute('height', '16');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', window.icons.post);
        svg.appendChild(path);
        return svg;
      }

      function countLabels(data) {
        var counts = { All: 0 };
        data.posts.forEach(function (item) {
          counts.All += 1;
          item.labels.forEach(function (label) {
            counts[label] = (counts[label] || 0) + 1;
          });
        });
        return counts;
      }

      function renderCloud(data, counts) {
        var colors = data.label_colors;
        Object.keys(counts)
          .sort(function (a, b) {
            return counts[b] - counts[a];
          })
          .forEach(function (label) {
            var button = document.createElement('button');
            button.className = 'in-tag-cloud-item';
            button.type = 'button';
            button.dataset.label = label;

            // Neutral chip + colour dot: label colours stay visible without
            // making the cloud a wall of saturated backgrounds.
            if (label !== 'All') {
              var dot = document.createElement('span');
              dot.className = 'in-tag-cloud-dot';
              dot.style.backgroundColor = colors[label] || 'var(--in-color-muted)';
              button.appendChild(dot);
            }
            button.appendChild(document.createTextNode(label));

            var count = document.createElement('span');
            count.className = 'in-tag-cloud-count';
            count.textContent = counts[label];
            button.appendChild(count);

            button.onclick = function () {
              showLabel(label);
            };
            knownLabels.push(label);
            cloud.appendChild(button);
          });
      }

      function renderRows(data) {
        data.posts.forEach(function (item) {
          var row = document.createElement('li');
          row.className = 'in-post-list-item-wrapper';
          row.dataset.labels = item.labels.join(' ');

          var link = document.createElement('a');
          link.className = 'in-post-list-item';
          link.href = item.url;

          var title = document.createElement('div');
          title.className = 'in-post-list-title';
          title.appendChild(postIcon());
          var label = document.createElement('span');
          label.textContent = item.title;
          title.appendChild(label);

          // Second line: label chips then a muted date, so long titles and
          // many labels never fight for one row.
          var badges = document.createElement('div');
          badges.className = 'in-post-list-badges';
          item.labels.forEach(function (name) {
            badges.appendChild(badge(name, data.label_colors[name]));
          });
          var date = document.createElement('span');
          date.className = 'in-post-list-date';
          date.textContent = item.date;
          badges.appendChild(date);

          link.appendChild(title);
          link.appendChild(badges);
          row.appendChild(link);
          list.appendChild(row);
        });
      }

      function setVisible(row, visible) {
        row.hidden = !visible;
      }

      function setHeading(text, title) {
        heading.textContent = text;
        document.title = title;
      }

      function showLabel(label) {
        if (window.location.hash.slice(1) === encodeURI(label)) {
          return;
        }
        window.location.hash = '#' + label;
        filter(label);
      }

      function showEmpty(message) {
        rows().forEach(function (row) {
          setVisible(row, false);
        });
        var box = document.createElement('div');
        box.className = 'in-empty-state-box';
        // Icon built from the window.icons crop, same as post rows use.
        var glyph = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        glyph.setAttribute('class', 'octicon');
        glyph.setAttribute('width', '24');
        glyph.setAttribute('height', '24');
        glyph.setAttribute('aria-hidden', 'true');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', (window.icons || {}).tag || '');
        glyph.appendChild(path);
        box.appendChild(glyph);
        box.appendChild(document.createTextNode(message));
        emptyState.textContent = '';
        emptyState.appendChild(box);
        emptyState.hidden = false;
      }

      function filter(label) {
        var all = rows();
        emptyState.hidden = true;

        // Keep the cloud's active chip in sync with the visible filter.
        cloud.querySelectorAll('.in-tag-cloud-item').forEach(function (chip) {
          chip.classList.toggle('is-active', chip.dataset.label === label);
        });

        if (label === 'All') {
          all.forEach(function (row) {
            setVisible(row, true);
          });
          setHeading('Tag #' + label, label + ' - ' + pageTitle);
          return;
        }

        if (knownLabels.indexOf(label) === -1) {
          // An unrecognised hash is free text rather than a tag.
          // No inline form: free text is the modal's job now.
          setHeading('#' + label, label + ' - ' + pageTitle);
          showEmpty('Not Find "' + label + '"');
          return;
        }

        all.forEach(function (row) {
          setVisible(row, row.dataset.labels.split(' ').indexOf(label) !== -1);
        });
        setHeading('Tag #' + label, label + ' - ' + pageTitle);
      }

      var request = new XMLHttpRequest();
      request.open('GET', 'search-index.json');
      request.responseType = 'text';
      request.onload = function () {
        var data = JSON.parse(request.response);
        renderCloud(data, countLabels(data));
        renderRows(data);
        filter(decodeURI(window.location.hash.slice(1)) || 'All');
      };
      request.send();
    })();
  </script>
