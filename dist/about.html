  <script>
    
    var themeSettings = {
      dark: ['dark', 'moon', '#00f0ff', 'dark'],
      light: ['light', 'sun', '#ff5000', 'light'],
      auto: ['auto', 'sync', '', 'preferred_color_scheme']
    };
    function resolveTheme(mode) {
      return mode === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : mode;
    }
    function changeTheme(mode, icon, color, giscusThemeName) {
      document.documentElement.setAttribute('data-color-mode', resolveTheme(mode));
      var sw = document.getElementById('themeSwitch');
      if (sw) {
        sw.setAttribute('d', window.icons[icon]);
        sw.parentNode.style.color = color;
      }
      if (window.giscusTheme) window.giscusTheme(giscusThemeName);
    }
    function modeSwitch() {
      var currentMode = localStorage.getItem('internote_theme') || 'light';
      var newMode = currentMode === 'light' ? 'dark' : currentMode === 'dark' ? 'auto' : 'light';
      localStorage.setItem('internote_theme', newMode);
      if (themeSettings[newMode]) {
        changeTheme.apply(null, themeSettings[newMode]);
      }
    }
    var theme = localStorage.getItem('internote_theme') || 'light';
    if (themeSettings[theme]) { changeTheme.apply(null, themeSettings[theme]); }
    
  </script>
