# InterNote 站点配置（键说明见 https://github.com/interset-wq/InterNote 的 config.sample.toml）
# 修改本文件后需手动运行 Actions -> build Internote -> Run workflow 全局重建一次

[site]
title = "InterNote"
sub_title = "My notes on everything"
avatar_url = "https://github.githubassets.com/favicons/favicon.svg"
# display_title = ""        # 默认与 title 相同
# favicon_url = ""          # 默认与 avatar_url 相同
# og_image = ""             # 默认与 avatar_url 相同
# home_url = ""             # 留空则自动推导（GitHub Pages 地址）
version = "last"             # 博客仓库 workflow 检出的 InterNote 版本（tag 或 last）
language = "CN"              # CN | EN | RU
utc = 8                      # 时区偏移（小时）

[theme]
mode = "manual"              # manual: 支持明暗切换 | fix: 固定
day = "light"
night = "dark"
# year_colors = ["#bc4c00", "#0969da", "#1f883d", "#A333D0"]

[layout]
one_page_list_num = 15       # 每页文章数
single_page = ["about"]      # 单页标签（如 ["about"]，对应 label 生成独立页面）
start_site = "2026-09-30"    # 建站日期（显示运行天数）
filing_num = ""              # ICP 备案号（留空不显示）
bottom_text = ""             # 文章页底部附加文字
show_post_source = true      # 是否显示指向 Issue 的源码链接
# head / style / script / index_script / index_style / all_head = ""  # 注入的 HTML 片段

[nav]
exlink = {}                  # 附加导航图标：{ "图标名": "链接" }，图标名需存在于 icon_list
icon_list = {}               # 自定义 SVG path：{ "图标名": "d=..." }

[comments]
enabled = true               # 是否启用评论
label_color = "#006b75"      # 评论数徽章颜色

[giscus]
repo = "interset-wq/interset-wq.github.io"  # 评论存储的仓库（需开启 Discussions）
repo_id = "R_kgDOTWqpPQ"
category = "Announcements"
category_id = "DIC_kwDOTWqpPc4DBFW-"

[features]
toc = true                   # 文章页目录（tocbot）
visit_counter = "busuanzi"   # off | vercount | busuanzi

[feed]
split = "sentence"           # RSS 摘要截断符："sentence" 或自定义字符
